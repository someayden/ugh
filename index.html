<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNCLE BEEZ HUB // CORE</title>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .panel {
            background-color: #111726;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 4px;
        }
        input, select, textarea {
            width: 100%;
            background-color: #090d16;
            border: 1px solid #ff3366;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            background-color: #111726;
            color: #ff3366;
            border: 1px solid #ff3366;
            padding: 12px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff3366;
            color: #090d16;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
        }
        .chat-box {
            height: 300px;
            border: 1px solid #334155;
            background-color: #090d16;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .msg { margin-bottom: 10px; }
        .user { color: #00ff66; }
        .ai { color: #ff3366; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>💔 UNCLE BEEZ HUB // SUBSYSTEM_V3</h1>
    <div class="subtitle">🥀 Network Core Status: OPERATIONAL // Pages Deployment Locked</div>

    <div class="container">
        <!-- left panel: music only -->
        <div class="panel">
            <h2>🎵 AUDIO_STREAM // Global Feed</h2>
            <p>Stream public audio frequencies natively below.</p>
            
            <label for="streamSelect">Select Station Frequency:</label>
            <select id="streamSelect" onchange="changeStream()">
                <option value="https://radiomast.io">Frequency Alpha (Lo-Fi / Instrumental)</option>
                <option value="https://radiomast.io">Frequency Beta (Electronic Mix)</option>
                <option value="CUSTOM">Custom Direct Stream Link</option>
            </select>

            <div id="customInputArea" style="display: none;">
                <input type="text" id="customUrl" placeholder="Inject Direct Audio Stream URL...">
                <button onclick="loadCustomStream()">Load Custom Stream</button>
            </div>

            <audio id="audioPlayer" controls loop></audio>
            <div style="font-size: 12px; color: #888; margin-top: 5px;">Press play above to monitor output. 😭</div>
        </div>

        <!-- right panel: ai engine -->
        <div class="panel">
            <h2>🤖 AI_COGNITION // Dialogue Array</h2>
            <input type="password" id="apiKey" placeholder="Gemini Engine Key Token...">
            
            <div class="chat-box" id="chatBox"></div>
            
            <input type="text" id="userInput" placeholder="Inject logical query..." onkeydown="if(event.key==='Enter') sendQuery()">
            <button onclick="sendQuery()">SEND QUERY</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('audioPlayer');
        player.src = document.getElementById('streamSelect').value;

        function changeStream() {
            const selector = document.getElementById('streamSelect');
            const customArea = document.getElementById('customInputArea');
            if (selector.value === "CUSTOM") {
                customArea.style.display = "block";
            } else {
                customArea.style.display = "none";
                player.src = selector.value;
                player.play().catch(() => {});
            }
        }

        function loadCustomStream() {
            const url = document.getElementById('customUrl').value;
            if(url) {
                player.src = url;
                player.play().catch(() => {});
            }
        }

        async function sendQuery() {
            const input = document.getElementById('userInput');
            const key = document.getElementById('apiKey').value;
            const box = document.getElementById('chatBox');
            
            if(!input.value.trim()) return;
            if(!key) {
                box.innerHTML += `<div class="msg"><span class="ai">Error:</span> Token validation failed. 🥀</div>`;
                return;
            }

            const prompt = input.value;
            box.innerHTML += `<div class="msg"><span class="user">User:</span> ${prompt}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            const url = `https://googleapis.com{key}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="msg"><span class="ai">Gemini:</span> ${reply}</div>`;
            } catch (err) {
                box.innerHTML += `<div class="msg"><span class="ai">Error:</span> Pipeline sync error. 💔</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
